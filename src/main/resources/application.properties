# URL kept clean to prevent concatenation errors with environment variables
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.pvyyvidefhehorxkaveh
spring.datasource.password=Riel.Diango1024*
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# SUPABASE POSTGRESQL & HIKARICP CONNECTION POOL OPTIMIZATION
# ==============================================================

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=FTNHS-HikariPool

# THE FIX: Safely passes prepareThreshold=0 to the Postgres driver bypassing URL strings
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ==============================================================
# SPRING DATA JPA / HIBERNATE SETTINGS
# ==============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==============================================================
# PERSISTENT SESSION & COOKIE CONFIGURATION
# ==============================================================
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=LAX

