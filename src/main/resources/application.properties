spring.application.name=weather-manager

# ==============================================================
# SUPABASE POSTGRESQL DATABASE CONFIGURATION
# ==============================================================

# Replace [YOUR-PASSWORD] with your actual Supabase database password.
# Notice the port is usually 6543 for the connection pooler, not 5432.
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.pvyyvidefhehorxkaveh
spring.datasource.password=Riel.Diango1024*
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# SUPABASE POSTGRESQL & HIKARICP CONNECTION POOL OPTIMIZATION
# ==============================================================

# Minimum idle connections maintained in the pool
spring.datasource.hikari.minimum-idle=2

# Maximum pool size (optimized for Render free tier & Supabase connection limits)
spring.datasource.hikari.maximum-pool-size=5

# How long a connection can sit idle before being closed (5 minutes)
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime of a connection in the pool (10 minutes)
# Must be shorter than Supabase's server-side connection timeout (~15 mins)
spring.datasource.hikari.max-lifetime=600000

# Connection timeout when requesting a connection from the pool (20 seconds)
spring.datasource.hikari.connection-timeout=20000

# Test query executed before borrowing a connection to prevent "broken connection" errors
spring.datasource.hikari.connection-test-query=SELECT 1

# Custom pool name for easier tracking in Diagnostics logs
spring.datasource.hikari.pool-name=FTNHS-HikariPool

# ==============================================================
# SPRING DATA JPA / HIBERNATE SETTINGS
# ==============================================================

# Validates that our Java Entities match the SQL schema we ran in Phase 1
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly configured to resolve startup warning and follow best practices
spring.jpa.open-in-view=false

# ==============================================================
# SERVER CONFIGURATION
# ==============================================================
server.port=8081