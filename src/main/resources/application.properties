spring.application.name=weather-manager

# ==============================================================
# SUPABASE POSTGRESQL DATABASE CONFIGURATION
# All values are loaded from environment variables.
# For local development, set these in application-local.properties
# (see application-local.properties.example).
# ==============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}?prepareThreshold=0
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# SUPABASE POSTGRESQL & HIKARICP CONNECTION POOL OPTIMIZATION
# ==============================================================

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=FTNHS-HikariPool

# ==============================================================
# SPRING DATA JPA / HIBERNATE SETTINGS
# ==============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==============================================================
# PERSISTENT SESSION & COOKIE CONFIGURATION
# ==============================================================
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=LAX

# ==============================================================
# WEB PUSH NOTIFICATION (VAPID) CONFIGURATION
# All values are loaded from environment variables.
# ==============================================================
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT}

# ==============================================================
# SERVER CONFIGURATION & CLOUD PROXY FIXES
# ==============================================================
server.port=${PORT:8081}

# Automatically handles Render's reverse proxy headers securely
server.forward-headers-strategy=framework

# ==============================================================
# LOGGING — override per-profile (e.g. application-local.properties)
# ==============================================================
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN