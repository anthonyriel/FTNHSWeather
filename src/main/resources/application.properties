spring.datasource.username=postgres.pvyyvidefhehorxkaveh
spring.datasource.password=Riel.Diango1024*
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# SPRING DATA JPA / HIBERNATE SETTINGS
# ==============================================================

# Dialect ensures Hibernate writes PostgreSQL-optimized queries
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Validates that our Java Entities match the SQL schema we ran in Phase 1
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# SERVER CONFIGURATION
# ==============================================================
server.port=8081