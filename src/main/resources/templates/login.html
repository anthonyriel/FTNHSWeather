<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FTNHS Weather Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow border-0 p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <div class="text-center mb-4">
                <h3 class="fw-bold"><i class="bi bi-shield-lock-fill text-danger me-2"></i>Admin Login</h3>
                <p class="text-muted small">Enter your credentials to access system overrides.</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}">
                Invalid credentials
            </div>

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Username</label>
                    <input type="text" class="form-control" name="username" placeholder="admin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left"></i> Back to Public Dashboard</a>
            </div>
        </div>
    </div>

</body>
</html>
