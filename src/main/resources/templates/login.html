<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FTNHS Weather Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-font: 'Inter', sans-serif;
            --heading-font: 'Poppins', sans-serif;
        }
        body {
            font-family: var(--primary-font);
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--heading-font);
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center p-3">
        <div class="card border-0 shadow-sm rounded-4 p-4 w-100 bg-white" style="max-width: 400px;">
            <div class="card-body p-2">
                <div class="text-center mb-4">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-4 d-inline-block text-danger fs-3 mb-3">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Admin Login</h3>
                    <p class="text-muted small mb-0">Enter your credentials to access system overrides.</p>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2 small border-0 rounded-3 mb-3" role="alert" th:text="${error}">
                    Invalid credentials
                </div>

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Username</label>
                        <input type="text" class="form-control rounded-3" name="username" placeholder="admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Password</label>
                        <input type="password" class="form-control rounded-3" name="password" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2 rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="/" class="text-decoration-none small text-muted fw-medium"><i class="bi bi-arrow-left me-1"></i> Back to Public Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
