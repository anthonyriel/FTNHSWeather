<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Accounts - FTNHS Weather Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-cloud-rain-fill text-info me-2"></i> FTNHS Weather Hub - Admin Panel
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white small me-3">
                    <i class="bi bi-person-circle text-info me-1"></i> <strong th:text="${session.adminName}">Admin</strong>
                </span>
                <a href="/" class="btn btn-outline-light btn-sm fw-bold me-2">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
                <form action="/logout" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger btn-sm fw-bold">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-secondary"><i class="bi bi-people-fill me-2"></i>User Accounts Management</h2>
            <button class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#userModal" onclick="prepareAddUser()">
                <i class="bi bi-person-plus-fill me-1"></i> Add New User
            </button>
        </div>

        <div class="card shadow border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="fw-bold" th:text="${user.name}">John Doe</td>
                                <td th:text="${user.username}">johndoe</td>
                                <td th:text="${user.email}">john@ftnhs.edu.ph</td>
                                <td>
                                    <span class="badge" th:classappend="${user.role == 'ADMIN' ? 'bg-danger' : 'bg-primary'}" th:text="${user.role}">ADMIN</span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:text="${user.status}">ACTIVE</span>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-secondary me-1" 
                                            th:data-id="${user.id}"
                                            th:data-username="${user.username}"
                                            th:data-name="${user.name}"
                                            th:data-email="${user.email}"
                                            th:data-role="${user.role}"
                                            onclick="prepareEditUser(this)">
                                        <i class="bi bi-pencil-fill"></i> Edit
                                    </button>
                                    <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="POST" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this user?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash-fill"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="modalTitle">Add New User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form action="/admin/users/save" method="POST">
                    <div class="modal-body">
                        <input type="hidden" id="userId" name="id">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Username</label>
                            <input type="text" class="form-control" id="modalUsername" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Full Name</label>
                            <input type="text" class="form-control" id="modalName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Email Address</label>
                            <input type="email" class="form-control" id="modalEmail" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Role</label>
                            <select class="form-select" id="modalRole" name="role" required>
                                <option value="ADMIN">ADMIN</option>
                                <option value="TEACHER">TEACHER</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Password <span class="text-muted fw-normal" id="passwordHint">(Leave blank to keep current when editing)</span></label>
                            <input type="password" class="form-control" id="modalPassword" name="password">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary fw-bold">Save Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function prepareAddUser() {
            document.getElementById('modalTitle').textContent = 'Add New User';
            document.getElementById('userId').value = '';
            document.getElementById('modalUsername').value = '';
            document.getElementById('modalName').value = '';
            document.getElementById('modalEmail').value = '';
            document.getElementById('modalRole').value = 'TEACHER';
            document.getElementById('modalPassword').value = '';
            document.getElementById('passwordHint').style.display = 'none';
            document.getElementById('modalPassword').required = true;
        }

        function prepareEditUser(button) {
            document.getElementById('modalTitle').textContent = 'Edit User Account';
            document.getElementById('userId').value = button.getAttribute('data-id');
            document.getElementById('modalUsername').value = button.getAttribute('data-username');
            document.getElementById('modalName').value = button.getAttribute('data-name');
            document.getElementById('modalEmail').value = button.getAttribute('data-email');
            document.getElementById('modalRole').value = button.getAttribute('data-role');
            document.getElementById('modalPassword').value = '';
            document.getElementById('passwordHint').style.display = 'inline';
            document.getElementById('modalPassword').required = false;

            new bootstrap.Modal(document.getElementById('userModal')).show();
        }
    </script>
</body>
</html>
